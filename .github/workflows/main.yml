name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

env:
  PROJECT_TYPE: KEXT
  ACID32: 0

jobs:
  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      JOB_TYPE: BUILD
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - name: Verify patch markers in source
        run: |
          git diff --stat 744126c3540f568a60d9b3d2ff63b88291c37ce7...3bd42cdf4a9465aebf1c9f811032e845abeb8bdd
          grep -n "encodedClockDiv" EmeraldSDHC/EmeraldSDHCSlot.cpp
          grep -n "tuningLoops" EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp

      - run: xcodebuild -jobs 1 -configuration Debug -arch x86_64
      - run: xcodebuild -jobs 1 -configuration Release -arch x86_64

      - name: Verify patch markers in DEBUG binary
        run: |
          cd build/Debug
          strings EmeraldSDHC.kext/Contents/MacOS/EmeraldSDHC | grep "Clock request"
          strings EmeraldSDHC.kext/Contents/MacOS/EmeraldSDHC | grep "after %u loops"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' EmeraldSDHC.kext/Contents/Info.plist)" = "0.1.5"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ../Release/EmeraldSDHC.kext/Contents/Info.plist)" = "0.1.5"

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldSDHC-0.1.5-patched
          path: build/*/*.zip
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*/*.zip
          tag: ${{ github.ref }}
          file_glob: true

  analyze-clang:
    name: Analyze Clang
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      JOB_TYPE: ANALYZE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - run: xcodebuild analyze -quiet -configuration Debug -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]
      - run: xcodebuild clean -quiet
      - run: xcodebuild analyze -quiet -configuration Release -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]

  analyze-coverity:
    name: Analyze Coverity
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      JOB_TYPE: COVERITY
    if: github.repository_owner == 'acidanthera' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
      - name: CI Bootstrap
        run: |
         src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - name: Run Coverity
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/coverity/covstrap.sh) && eval "$src" || exit 1
        env:
          COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
          COVERITY_SCAN_EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
          COVERITY_BUILD_COMMAND: xcodebuild -configuration Release
